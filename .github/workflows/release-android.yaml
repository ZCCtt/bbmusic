name: 构建 Android 应用

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要编译的分支'
        required: true
        default: 'dev/1.3'
      tag:
        description: 'Version tag'
        required: true
        default: 'v0.0.1'

jobs:
  main:
    name: Release Android App
    runs-on: ubuntu-latest
    steps:
      - name: 克隆仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: 添加签名文件
        run: |
          echo ${{ secrets.KEYSTORE_BASE64 }}  | base64 --decode > ./android/app/bbmusic-keystore.jks
          echo -e "${{ secrets.KEY_PROPERTIES }}" > ./android/key.properties
          ls -lh ./android/app/bbmusic-keystore.jks
          md5sum ./android/app/bbmusic-keystore.jks

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.2
          channel: stable
          cache: true

      - name: 构建 APK
        run: flutter build apk --split-per-abi

      - name: 自动打 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ github.event.inputs.tag }}
          git push origin ${{ github.event.inputs.tag }}

      - name: 发布 Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./build/app/outputs/flutter-apk/*
          tag_name: ${{ github.event.inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}